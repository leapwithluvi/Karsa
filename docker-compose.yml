services:
  db:
    image: postgres:16-alpine
    container_name: karsa_postgres_dev
    environment:
      - POSTGRES_USER=karsa_user
      - POSTGRES_PASSWORD=karsa_password
      - POSTGRES_DB=karsa_db_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=development

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8787
    depends_on:
      - api
volumes:
  postgres_data:
